
name: Build Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          WRAPPER=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "لم يتم العثور على gradlew"
            exit 1
          fi
          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAMO-APP-APK
          path: extracted/**/build/outputs/apk/**/*.apk
