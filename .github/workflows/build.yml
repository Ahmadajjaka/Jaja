
name: Build Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: extracted
        run: npm install

      - name: Build web app
        working-directory: extracted
        run: npm run build

      - name: Sync Android
        working-directory: extracted
        run: npx cap sync android

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.config/.android
          keytool -genkeypair -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate SHA Fingerprints
        working-directory: extracted/android
        run: |
          echo "=================================="
          echo "ANDROID SIGNING FINGERPRINTS"
          echo "=================================="
          bash gradlew signingReport

      - name: Build APK
        working-directory: extracted/android
        run: bash gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAMO-APP-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
